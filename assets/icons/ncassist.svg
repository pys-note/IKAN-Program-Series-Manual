<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<defs>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FCFBF8"/><stop offset=".6" stop-color="#EEEAE3"/><stop offset="1" stop-color="#D9D1C5"/></linearGradient>
  <linearGradient id="stoneSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A39B8E"/><stop offset="1" stop-color="#776F63"/></linearGradient>
  <radialGradient id="hole" cx=".42" cy=".38" r=".7"><stop offset="0" stop-color="#2A3552"/><stop offset="1" stop-color="#0B1222"/></radialGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C8798"/><stop offset=".42" stop-color="#F3F5F8"/><stop offset="1" stop-color="#8E99AA"/></linearGradient>
  <linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A4A6B"/><stop offset="1" stop-color="#1E2840"/></linearGradient>
  <linearGradient id="jet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFF3FF" stop-opacity=".95"/><stop offset="1" stop-color="#2FC7F0" stop-opacity=".9"/></linearGradient>
  <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC24A"/><stop offset="1" stop-color="#E8901A"/></linearGradient>
  <filter id="blur6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<!-- slab -->
<ellipse cx="128" cy="228" rx="104" ry="10" fill="#0B1222" opacity=".28" filter="url(#blur6)"/>
<rect x="34" y="106" width="196" height="104" rx="5" fill="#0B1222" opacity=".25" filter="url(#blur3)"/>
<rect x="32" y="112" width="196" height="96" rx="5" fill="url(#stoneSide)"/>
<rect x="32" y="98" width="196" height="100" rx="5" fill="url(#stone)" stroke="#4A4336" stroke-width="2"/>
<rect x="36" y="99.4" width="188" height="1.6" rx=".8" fill="#FFFFFF" opacity=".9"/>
<g fill="#A99F90" opacity=".5"><circle cx="58" cy="182" r="1.2"/><circle cx="92" cy="110" r=".9"/><circle cx="118" cy="186" r="1.1"/><circle cx="206" cy="118" r="1"/><circle cx="196" cy="184" r="1.3"/><circle cx="74" cy="140" r=".8"/></g>
<!-- sink cutout outline (already placed) -->
<rect x="48" y="118" width="70" height="44" rx="9" fill="#E3EEF7" stroke="#6C8FB0" stroke-width="1.6" stroke-dasharray="5 3"/>
<!-- origin: bottom-left corner + axes -->
<g stroke="#27324D" stroke-width="2.6" stroke-linecap="round" fill="none">
  <path d="M32 222 H214"/><path d="M18 198 V96"/>
</g>
<g fill="#27324D"><path d="M220 222 l-9 -5 v10 z"/><path d="M18 90 l-5 9 h10 z"/></g>
<circle cx="32" cy="198" r="5" fill="#FFFFFF" stroke="#27324D" stroke-width="2.4"/>
<!-- measured position of the hole -->
<g stroke="#E8901A" stroke-width="2" stroke-dasharray="4 3" fill="none"><path d="M164 152 V222"/><path d="M164 152 H18"/></g>
<g fill="url(#amber)"><rect x="157" y="216" width="14" height="12" rx="3"/><rect x="12" y="145" width="12" height="14" rx="3"/></g>
<!-- round cutout + target -->
<circle cx="164" cy="152" r="21" fill="url(#hole)" stroke="#2A3552" stroke-width="1.5"/>
<path d="M150 140 A20 20 0 0 1 178 140" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".18"/>
<circle cx="164" cy="152" r="29" fill="none" stroke="url(#amber)" stroke-width="3.2"/>
<g stroke="#FFC24A" stroke-width="3" stroke-linecap="round"><path d="M164 117 V128"/><path d="M164 176 V187"/><path d="M129 152 H140"/><path d="M188 152 H199"/></g>
<!-- waterjet head -->
<circle cx="164" cy="132" r="12" fill="#6FE0FF" opacity=".55" filter="url(#glow)"/>
<path d="M161.4 74 H166.6 L165.6 132 H162.4 Z" fill="url(#jet)"/>
<path d="M163.3 76 V130" stroke="#FFFFFF" stroke-width="1" opacity=".8"/>
<rect x="152" y="54" width="24" height="22" rx="3" fill="url(#steel)" stroke="#5E6A7C" stroke-width="1.2"/>
<path d="M156 76 H172 L168 86 H160 Z" fill="url(#steel)" stroke="#5E6A7C" stroke-width="1.2" stroke-linejoin="round"/>
<rect x="138" y="18" width="52" height="38" rx="7" fill="url(#head)"/>
<rect x="144" y="25" width="26" height="5.5" rx="2.75" fill="#FFFFFF" opacity=".9"/>
<rect x="144" y="35" width="16" height="4.5" rx="2.25" fill="#7F8FB3"/>
<circle cx="179" cy="28" r="4" fill="#2FE08A"/>
<circle cx="179" cy="28" r="7" fill="#2FE08A" opacity=".25"/>
<rect x="190" y="30" width="44" height="12" rx="3" fill="#56688F"/>
<rect x="190" y="30" width="44" height="3" rx="1.5" fill="#FFFFFF" opacity=".25"/>
</svg>
