<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECEFF5"/></linearGradient>
  <linearGradient id="band" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3550A8"/><stop offset="1" stop-color="#1B2A66"/></linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FCFBF8"/><stop offset=".6" stop-color="#EEEAE3"/><stop offset="1" stop-color="#DCD5CA"/></linearGradient>
  <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6E1D8"/><stop offset="1" stop-color="#CFC7BA"/></linearGradient>
  <linearGradient id="flapV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#CFC7BA"/><stop offset="1" stop-color="#E6E1D8"/></linearGradient>
  <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0533F"/><stop offset="1" stop-color="#B8231A"/></linearGradient>
  <linearGradient id="edgeMark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F9DFF"/><stop offset="1" stop-color="#1D5FD4"/></linearGradient>
  <filter id="blur6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="blur2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
  <clipPath id="sheet"><rect x="18" y="30" width="200" height="176" rx="11"/></clipPath>
  <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0 H0 V10" fill="none" stroke="#DCE3F1" stroke-width="1"/></pattern>
</defs>
<!-- drafting sheet (landscape, like a printed A3 unfold) -->
<rect x="30" y="44" width="200" height="176" rx="11" fill="#0B1222" opacity=".22" filter="url(#blur6)"/>
<rect x="28" y="38" width="200" height="176" rx="11" fill="#C9D1DE"/>
<rect x="22" y="40" width="200" height="176" rx="11" fill="#0B1222" opacity=".18" filter="url(#blur3)"/>
<rect x="18" y="30" width="200" height="176" rx="11" fill="url(#paper)"/>
<g clip-path="url(#sheet)">
  <rect x="18" y="58" width="200" height="148" fill="url(#grid)" opacity=".9"/>
  <rect x="18" y="30" width="200" height="28" fill="url(#band)"/>
  <rect x="18" y="57" width="200" height="1.5" fill="#0B1222" opacity=".2"/>
  <rect x="30" y="40" width="62" height="7.5" rx="3.75" fill="#FFFFFF" opacity=".95"/>
  <rect x="98" y="41" width="26" height="5.5" rx="2.75" fill="#FFFFFF" opacity=".45"/>
  <!-- title block -->
  <rect x="166" y="180" width="52" height="26" fill="#E6EBF6"/>
  <path d="M166 180 H218 M166 193 H218 M188 180 V206" stroke="#B8C3DA" stroke-width="1.2"/>
</g>
<rect x="18" y="30" width="200" height="176" rx="11" fill="none" stroke="#C9D0DC" stroke-width="1.2"/>
<!-- unfolded countertop: top face + folded-out flaps -->
<rect x="42" y="78" width="116" height="16" fill="#0B1222" opacity=".12" filter="url(#blur2)"/>
<path d="M44 76 H154 L148 92 H50 Z" fill="url(#flap)" stroke="#6E6656" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M32 92 H44 V138 H32 Z" fill="url(#flapV)" stroke="#6E6656" stroke-width="1.6" stroke-linejoin="round"/>
<path d="M158 92 H170 V138 H158 Z" fill="url(#flapV)" stroke="#6E6656" stroke-width="1.6" stroke-linejoin="round"/>
<rect x="44" y="92" width="114" height="46" fill="url(#stone)" stroke="#4A4336" stroke-width="2"/>
<path d="M44 138 H158 V160 H44 Z" fill="url(#flap)" stroke="#6E6656" stroke-width="1.6"/>
<!-- fold lines -->
<g stroke="#1D5FD4" stroke-width="1.5" stroke-dasharray="4 3" fill="none"><path d="M44 92 H158"/><path d="M44 138 H158"/><path d="M44 92 V138"/><path d="M158 92 V138"/></g>
<!-- front edge finish -->
<rect x="46" y="155" width="110" height="3.4" rx="1.4" fill="url(#edgeMark)"/>
<!-- quartz speckles -->
<g fill="#A99F90" opacity=".55"><circle cx="62" cy="104" r="1.1"/><circle cx="84" cy="122" r=".9"/><circle cx="108" cy="102" r="1.2"/><circle cx="131" cy="126" r=".8"/><circle cx="146" cy="108" r="1"/><circle cx="72" cy="131" r=".8"/></g>
<!-- dimension -->
<g stroke="#4E5F68" stroke-width="1.6" stroke-linecap="round" fill="none"><path d="M44 168 V180 M158 168 V180"/><path d="M47 174 H86 M116 174 H155"/></g>
<g fill="#4E5F68"><path d="M45.5 174 l6 -3.2 v6.4 z"/><path d="M156.5 174 l-6 -3.2 v6.4 z"/></g>
<rect x="88" y="169" width="26" height="10" rx="5" fill="#4E5F68"/><rect x="94" y="172.6" width="14" height="2.8" rx="1.4" fill="#FFFFFF" opacity=".9"/>
<!-- vermilion seal (hanko) -->
<g transform="rotate(-10 196 196)">
  <circle cx="198" cy="199" r="40" fill="#3B0B07" opacity=".32" filter="url(#blur6)"/>
  <circle cx="196" cy="196" r="38" fill="url(#seal)"/>
  <circle cx="196" cy="196" r="31" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".9"/>
  <!-- white mark: top face + folded-out front flap -->
  <rect x="176" y="176" width="40" height="22" rx="2.5" fill="#FFFFFF"/>
  <path d="M176 202 H216 L210 216 H182 Z" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M174 200 H218" stroke="#FFFFFF" stroke-width="2.2" stroke-dasharray="3.5 2.5" opacity=".9"/>
</g>
</svg>
